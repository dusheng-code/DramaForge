[project]
name = "dramaforge"
version = "0.1.0"
description = "DramaForge — AI 短剧受控生产系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "pymilvus>=2.4",
    "python-multipart>=0.0.9",
    "mistune>=3.0",
]

[project.optional-dependencies]
# 在线/离线向量化（BGE-M3 via FlagEmbedding，重依赖 torch，按需安装）
embed = ["FlagEmbedding>=1.2"]
# 规格 §12 允许但一期实现未依赖（保留装配位，避免隐含依赖）
graph = ["langgraph>=0.2", "langchain-core>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dramaforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/dramaforge"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
